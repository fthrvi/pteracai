<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PteracAI — PTE Practice with Real Feedback</title>
<link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
<header class="topbar">
  <div class="brand">PteracAI</div>
  <nav class="sections">
    <button data-section="reading" class="section-btn active">Reading</button>
    <button data-section="listening" class="section-btn">Listening</button>
    <button data-section="writing" class="section-btn">Writing</button>
    <button id="tips-nav" class="section-btn tips-nav-btn">Tips</button>
    <button id="settings-nav" class="section-btn settings-nav-btn">Settings</button>
  </nav>
  <div class="stats">
    <span id="stat-correct">0</span>/<span id="stat-attempted">0</span>
    <span class="muted">streak</span> <span id="stat-streak">0</span>
  </div>
</header>

<main>
  <section id="picker" class="panel">
    <h2 id="picker-title">Pick a task type</h2>
    <div id="picker-list" class="picker-list"></div>
    <button id="random-btn" class="primary">Random question</button>
  </section>

  <section id="card" class="panel hidden"></section>

  <section id="feedback" class="panel hidden"></section>

  <section id="bridge-status" class="bridge hidden">
    <div class="bridge-inner">
      <span class="spinner"></span>
      <span class="bridge-text">Generating with Claude...</span>
      <div id="bridge-hint" class="bridge-hint hidden">
        In your terminal, tell Claude Code:
        <code>process pending pterac requests</code>
      </div>
    </div>
  </section>

  <section id="tips-view" class="panel hidden tips-view"></section>

  <section id="settings-view" class="panel hidden settings-view"></section>
</main>

<aside id="tips" class="tips panel hidden">
  <h3>Tips for this task type</h3>
  <div id="tips-list"></div>
</aside>

<script src="/static/app.js"></script>
</body>
</html>
